<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOX MODEL IN CSS</title>
</head>

<style>
    .content {
        width: 400px;
        height: 400px;
        background-color: rgb(0, 0, 0);
        padding: 20px;
        border: 30px solid rgb(255, 0, 0);
        margin: 20px;
    }

    button:hover {

        width: 100px;
        height: 100px;
        border-radius: 50px;
        background-color: rgb(255, 0, 0);
        border: none;
        cursor: pointer;
    }
    
    
</style>

<body>

    <div class="content">
        
        <button>Click me</button>
        <button>SUBMIT</button>
    

    </div>

</body>
</html>
